[package]
name = "anchorshell"
version = "0.1.0-alpha.1"
description = "Windows-first remote operations workspace"
authors = ["AnchorShell contributors"]
edition = "2021"

[lib]
name = "anchorshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
