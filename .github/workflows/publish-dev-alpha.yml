name: Publish Dev Alpha

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-dev-alpha.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-alpha.2-dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName "artifacts/AnchorShell-0.1.0-alpha.2-dev-windows-x64-setup.exe"
          "AnchorShell $env:RELEASE_TAG" | Set-Content artifacts/BUILD.txt
          "Source commit: $env:GITHUB_SHA" | Add-Content artifacts/BUILD.txt
          "Signing: UNSIGNED DEVELOPMENT BUILD" | Add-Content artifacts/BUILD.txt
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content artifacts/SHA256SUMS.txt
          }

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $notes = @"
          AnchorShell v0.1.0-alpha.2-dev

          Windows x64 development alpha.

          This build is intentionally UNSIGNED and may trigger Windows SmartScreen.
          Use only for current functional testing.

          Includes:
          - working host add/remove/persistence
          - workspace selection
          - theme switching
          - SSH command copy
          - PowerShell detection
          - independent PowerShell launch
          - original AnchorShell icon
          "@

          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG artifacts/* --clobber
          } else {
            $notes | Set-Content release-notes.txt
            gh release create $env:RELEASE_TAG artifacts/* --target $env:GITHUB_SHA --title "AnchorShell $env:RELEASE_TAG" --prerelease --notes-file release-notes.txt
          }
