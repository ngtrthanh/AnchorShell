name: Publish G1 Alpha

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-g1-alpha.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.0-alpha.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/
          "AnchorShell $env:RELEASE_TAG" | Set-Content artifacts/BUILD.txt
          "Source commit: $env:GITHUB_SHA" | Add-Content artifacts/BUILD.txt
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content artifacts/SHA256SUMS.txt
          }

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            Write-Host "Release $env:RELEASE_TAG already exists; replacing assets."
            gh release upload $env:RELEASE_TAG artifacts/* --clobber
          } else {
            gh release create $env:RELEASE_TAG artifacts/* --target $env:GITHUB_SHA --title "AnchorShell $env:RELEASE_TAG" --prerelease --generate-notes
          }
