name: Windows CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend production build
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/
          "Source commit: $env:GITHUB_SHA" | Set-Content artifacts/BUILD.txt
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content artifacts/SHA256SUMS.txt
          }
          if (Test-Path package-lock.json) {
            Copy-Item package-lock.json artifacts/package-lock.generated.json
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AnchorShell-Windows-x64-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
