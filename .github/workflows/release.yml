name: Release Windows

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            "RELEASE_TAG=$env:GITHUB_REF_NAME" | Add-Content $env:GITHUB_ENV
          } else {
            "RELEASE_TAG=v0.1.0-alpha.1" | Add-Content $env:GITHUB_ENV
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Stage release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/
          "AnchorShell $env:RELEASE_TAG" | Set-Content artifacts/BUILD.txt
          "Source commit: $env:GITHUB_SHA" | Add-Content artifacts/BUILD.txt
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content artifacts/SHA256SUMS.txt
          }

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG artifacts/* --clobber
          } else {
            gh release create $env:RELEASE_TAG artifacts/* --target $env:GITHUB_SHA --title "AnchorShell $env:RELEASE_TAG" --prerelease --generate-notes
          }
